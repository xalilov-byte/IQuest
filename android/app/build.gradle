apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

/* Versiya loyiha ildizidagi version.json dan o'qiladi — bitta manba.
   Nima uchun: Play Market bir xil yoki kichik versionCode bilan
   yuklashni rad etadi, ya'ni har release'da u oshishi SHART. Raqam
   ikki joyda (bu yerda va hujjatda) yozilsa, biri unutiladi va
   yuklash oxirgi qadamda to'xtaydi. */
def nzVersionFile = rootProject.file("../version.json")
def nzVersion = new JsonSlurper().parseText(nzVersionFile.getText("UTF-8"))

/* ── ASSETS ESKIRIB QOLMASLIGI UCHUN TO'SIQ ────────────────────────────
   APK ichidagi veb-ilova `android/app/src/main/assets/public/` da
   turadi va u `npm run sync` (build.mjs + cap sync) bilan yangilanadi.
   Gradle buni O'ZI qilmaydi.

   Xavf aniq: kim `npm run sync` qilmasdan to'g'ridan-to'g'ri
   `./gradlew assembleRelease` desa, ESKI nusxa bilan APK chiqadi.
   Bir marta shunday bo'lgan ham — assets ichida allaqachon kesilgan
   taqlid to'lov oqimi (openPro, payStepMethod) qolib ketgan edi, ya'ni
   Play RAD ETADIGAN APK yig'ilishi mumkin edi.

   Shuning uchun yig'ish oldidan ikkala nusxa solishtiriladi. Farq
   bo'lsa build TO'XTAYDI va nima qilish kerakligini aytadi — jimgina
   eski fayl bilan davom etmaydi. */
def nzAssets = project.file("src/main/assets/public/index.html")
def nzWww = rootProject.file("../www/index.html")

tasks.register("nzAssetsFresh") {
    doLast {
        if (!nzWww.exists()) {
            throw new GradleException(
                "www/index.html yo'q. Avval yig'ing:\n" +
                "  npm run sync    (build.mjs + npx cap sync android)")
        }
        if (!nzAssets.exists()) {
            throw new GradleException(
                "APK ichidagi assets/public/index.html yo'q. Avval:\n" +
                "  npm run sync")
        }
        if (nzAssets.getText("UTF-8") != nzWww.getText("UTF-8")) {
            throw new GradleException(
                "APK ichidagi nusxa ESKIRGAN — www/index.html dan farq qiladi.\n" +
                "Bu holda do'kon rad etadigan yoki eskirgan ilova yig'iladi.\n" +
                "Yangilash:\n" +
                "  npm run sync    (build.mjs + npx cap sync android)")
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("nzAssetsFresh") }

/* ── ILOVA IDENTIFIKATORI VA NOMI ──────────────────────────────────────
   Yagona manba — loyiha ildizidagi capacitor.config.json (appId, appName).
   Nima uchun u yerda: `cap sync` ham shu qiymatlarni o'qiydi, ya'ni ID
   ikki joyda yozilsa, ular bir kun ajralib qoladi. Ish davomida nom
   bir marta almashgan (Zukko → IQuest) — shunda faqat manba va qo'lda
   yoziladigan ikki joy tahrirlandi (README.md → "Nomni almashtirish"),
   shuning uchun bu fayl nomni o'zi yozmaydi.

   applicationId — Play Market'dagi DOIMIY manzil: birinchi yuklashdan
   keyin o'zgartirib bo'lmaydi (boshqa ID = boshqa ilova).

   Loyiha Nazariy dvigatelidan olingan, Nazariy esa Play'da alohida
   ilova bo'lib qoladi. Uning ID'si qolib ketsa, bu APK Nazariy'ning
   "yangilanishi" bo'lib chiqadi — shuning uchun bunday ID bilan build
   darhol to'xtaydi. */
def iqCapConfig = rootProject.file("../capacitor.config.json")
def iqCap = new JsonSlurper().parseText(iqCapConfig.getText("UTF-8"))
def iqAppId = iqCap.appId
def iqAppName = iqCap.appName
if (!(iqAppId ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
    throw new GradleException("capacitor.config.json appId noto'g'ri: \"" + iqAppId + "\"")
}
if (iqAppId.toLowerCase().contains("nazariy")) {
    throw new GradleException(
        "capacitor.config.json appId = \"" + iqAppId + "\" — bu Nazariy ilovasining ID'si.\n" +
        "IQuest o'z ID'si bilan yig'iladi (README.md → \"Nomni almashtirish\").")
}

/* Qo'lda yoziladigan ikki joy capacitor.config.json ga mos kelishi
   shart. Mos kelmasa xato build'da emas, TELEFONDA chiqadi:
     - MainActivity.java — manifestdagi ".MainActivity" namespace'ga
       qo'shib o'qiladi. Java paketi boshqacha bo'lsa build O'TADI,
       lekin ilova ochilishi bilan ClassNotFoundException bilan yiqiladi.
     - strings.xml — launcher'dagi nom (app_name) va Capacitor'ning
       package_name / custom_url_scheme qiymatlari.
   Shuning uchun ikkalasi yig'ishdan oldin solishtiriladi. */
def iqActivity = project.file("src/main/java/" + iqAppId.replace('.', '/') + "/MainActivity.java")
def iqStrings = project.file("src/main/res/values/strings.xml")

tasks.register("iqIdentity") {
    doLast {
        if (!iqActivity.exists()) {
            throw new GradleException(
                "MainActivity topilmadi: " + iqActivity + "\n" +
                "Java paketi papkasi applicationId (" + iqAppId + ") bilan bir xil bo'lishi shart.")
        }
        if (!iqActivity.getText("UTF-8").contains("package " + iqAppId + ";")) {
            throw new GradleException(
                "MainActivity.java dagi package satri \"" + iqAppId + "\" emas.\n" +
                "Mos kelmasa ilova ishga tushishda yiqiladi.")
        }
        def xml = iqStrings.getText("UTF-8")
        def want = [
            app_name: iqAppName, title_activity_main: iqAppName,
            package_name: iqAppId, custom_url_scheme: iqAppId
        ]
        want.each { key, val ->
            if (!xml.contains("<string name=\"" + key + "\">" + val + "</string>")) {
                throw new GradleException(
                    "strings.xml → " + key + " \"" + val + "\" emas (capacitor.config.json bilan mos emas).")
            }
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("iqIdentity") }

/* Yig'ilgan fayllar nomi: IQuest-release.apk / IQuest-debug.apk /
   IQuest-release.aab (standart "app-..." o'rniga). Ilova nomidan
   olinadi; fayl nomida bo'sh joy va apostrof bo'lmasligi uchun
   faqat lotin harfi va raqam qoldiriladi. */
base {
    archivesName = iqAppName.replaceAll('[^A-Za-z0-9]+', '-')
}

android {
    namespace = iqAppId
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId iqAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nzVersion.versionCode
        versionName nzVersion.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* ── Imzo (signing) ────────────────────────────────────────────────
       Kalit fayli va parollar loyihada SAQLANMAYDI. Ikki manba:
         1) mahalliy:  android/keystore.properties  (git'ga tushmaydi)
         2) CI:        IQUEST_KEYSTORE / IQUEST_STORE_PASSWORD /
                       IQUEST_KEY_ALIAS / IQUEST_KEY_PASSWORD muhit
                       o'zgaruvchilari (GitHub Secrets)
       Kalit topilmasa release baribir yig'iladi — faqat imzosiz
       (Play Market'ga yuklash uchun imzo shart).

       Kalit IQuest'ning O'ZINIKI bo'lishi shart (PLAY.md §7). Nazariy
       kalitini qayta ishlatish eng ehtimolli xato (loyiha o'sha
       dvigateldan olingan, eski hujjatda alias "nazariy" edi), shuning
       uchun bunday alias'li kalit bilan build to'xtaydi.               */
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) props.load(new FileInputStream(f))
            def storePath = props['storeFile'] ?: System.getenv('IQUEST_KEYSTORE')
            if (storePath && file(storePath).exists()) {
                def iqAlias = props['keyAlias'] ?: System.getenv('IQUEST_KEY_ALIAS')
                if (iqAlias && iqAlias.toLowerCase().contains("nazariy")) {
                    throw new GradleException(
                        "Imzo kaliti alias'i \"" + iqAlias + "\" — bu Nazariy ilovasining kaliti.\n" +
                        "IQuest uchun alohida kalit yarating (PLAY.md §7).")
                }
                storeFile file(storePath)
                storePassword props['storePassword'] ?: System.getenv('IQUEST_STORE_PASSWORD')
                keyAlias iqAlias
                keyPassword props['keyPassword'] ?: System.getenv('IQUEST_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
