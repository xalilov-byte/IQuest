# ─────────────────────────────────────────────────────────────────────────
#  Zukko — baza tekshiruvi
#
#  Ikki ish bajaradi:
#
#  1. migratsiya — toza PostgreSQL 16 da to'liq zanjir (Supabase kerak
#     emas: auth sxemasi va Supabase'ning standart huquqlari taqlid
#     qilinadi — supabase/tests/_stub.sql):
#       · seed generatori testlari va "seed manbaga mos" tekshiruvi;
#       · _stub → apply.sh (ikki marta) → seed → RLS/to'rt ko'z testlari;
#       · apply.sh begona (Nazariy) bazaga yozmasligi;
#       · SALBIY TEKSHIRUV: har himoya alohida olib tashlanadi va testlar
#         aynan o'sha joyda yiqilishi talab qilinadi (mutantlar).
#     SQL'dagi xato Supabase'ga tegmasdan shu yerda tutiladi.
#
#  2. jonli-tekshiruv — haqiqiy Supabase loyihasida RLS tashqaridan
#     HAQIQATAN to'sayotganini tekshiradi (publishable kalit bilan, hech
#     narsa yozmaydi). supabase/config.json bo'sh bo'lsa — o'tkazib
#     yuboriladi (hozir shunday: ilova offline ishlaydi).
# ─────────────────────────────────────────────────────────────────────────
name: Baza

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
      - 'content/verbal.json'
      - '.github/workflows/db.yml'

jobs:
  migratsiya:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zk
          POSTGRES_PASSWORD: zk
          POSTGRES_DB: zk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Faqat CI ichidagi vaqtinchalik konteyner — maxfiy emas.
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: zk
      PGPASSWORD: zk
      PGDATABASE: zk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: psql o'rnatish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Seed generatori testlari
        run: node --test supabase/tests/*.test.mjs

      - name: Seed manbaga mos kelishini tekshirish
        # Generator qayta ishga tushirilganda seed/ o'zgarmasligi kerak —
        # aks holda seed qo'lda tahrirlangan yoki content/verbal.json
        # o'zgargan, lekin generator qayta yurgizilmagan. `git status`
        # (diff emas): yangi, commit qilinmagan seed fayli ham ushlanadi.
        # content/verbal.json yo'q bo'lsa generator aniq xabar bilan
        # yiqiladi — seed'siz baza "hammasi joyida" ko'rinmasin.
        run: |
          node supabase/mkseed.mjs
          if [ -n "$(git status --porcelain supabase/seed)" ]; then
            echo "::error::supabase/seed/ content/verbal.json ga mos emas — 'node supabase/mkseed.mjs' ni ishga tushirib, natijani commit qiling"
            git status --short supabase/seed
            git diff --stat supabase/seed
            exit 1
          fi
          echo "seed manbaga mos"

      - name: To'liq zanjir, RLS testlari va salbiy tekshiruv (mutantlar)
        run: node supabase/tests/run.mjs

  jonli-tekshiruv:
    runs-on: ubuntu-latest
    needs: migratsiya
    steps:
      - uses: actions/checkout@v4

      - name: Supabase loyihasini tashqaridan tekshirish
        run: bash supabase/tests/live.sh
