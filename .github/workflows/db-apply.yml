# ─────────────────────────────────────────────────────────────────────────
#  Zukko — migratsiya va seed'ni Supabase'ga qo'llash
#
#  NIMA UCHUN CI ORQALI: Claude Code ishlayotgan bulutli muhitdan Supabase
#  domenlari tashqi tarmoq siyosati bilan yopiq, GitHub runner'ida esa
#  tarmoq ochiq. SQL'ni qo'lda nusxalab qo'yish shart emas.
#
#  BIR MARTALIK SOZLASH (batafsil: supabase/README.md):
#
#    1. Zukko uchun YANGI Supabase loyihasi oching (Nazariy'niki EMAS!).
#    2. Supabase → Project Settings → Database → Connection string → URI
#       (Session pooler tavsiya etiladi). [YOUR-PASSWORD] ni haqiqiy parol
#       bilan almashtiring.
#    3. GitHub → repo → Settings → Secrets and variables → Actions →
#       New repository secret:  Nom: SUPABASE_DB_URL   Qiymat: o'sha URI
#    4. Actions → "Bazaga qo'llash" → Run workflow → tasdiq: ha
#
#  Bu satr BAZA PAROLINI saqlaydi — u faqat GitHub Secrets'da turadi,
#  logda ko'rinmaydi va repoga tushmaydi. Uni chatga ham yozmang.
#
#  XAVFSIZLIK:
#    · workflow faqat qo'shadi; jadval o'chirish yoki tozalash yo'q;
#      qo'llangan migratsiya qayta ishga tushmaydi (supabase/apply.sh);
#    · apply.sh Nazariy (yoki boshqa loyiha) bazasini tanib, unga HECH
#      NARSA yozmasdan to'xtaydi — secret'ga tasodifan eski ulanish
#      satri qo'yilsa ham;
#    · ishga tushirish FAQAT qo'lda: bazaga o'zgartirish har doim
#      ataylab qilinadigan amal.
# ─────────────────────────────────────────────────────────────────────────
name: Bazaga qo'llash

on:
  workflow_dispatch:
    inputs:
      tasdiq:
        description: 'Migratsiya va seed Zukko bazasiga qo''llanadi. Davom etish uchun "ha" deb yozing'
        required: true
        default: 'yoq'

jobs:
  qollash:
    runs-on: ubuntu-latest
    steps:
      - name: Tasdiqni tekshirish
        if: ${{ inputs.tasdiq != 'ha' }}
        run: |
          echo "::error::Tasdiq berilmadi — hech narsa qilinmadi. Qayta ishga tushirib \"ha\" deb yozing."
          exit 1

      - uses: actions/checkout@v4

      - name: psql o'rnatish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Maxfiy satr borligini tekshirish
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret'i qo'yilmagan. Yo'riqnoma: supabase/README.md §1."
            exit 1
          fi
          echo "secret mavjud"

      - name: Migratsiya va seed'ni qo'llash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash supabase/apply.sh

      - name: Tashqaridan RLS tekshiruvi
        # Publishable kalit bilan, klient ko'radigan manzara: nashr
        # etilganlar ochiq; qoralama, jurnal, natijalar va anonim javoblar
        # yopiq; anon hech narsa yoza olmaydi. config.json hali bo'sh
        # bo'lsa — eslatma bilan o'tkazib yuboriladi.
        run: |
          if [ -z "$(node -p "require('./supabase/config.json').url || ''")" ]; then
            echo "::warning::supabase/config.json bo'sh — tashqi tekshiruv o'tkazilmadi. Yangi loyihaning url va publishable kalitini yozib commit qiling; keyin 'Baza' workflow'i jonli tekshiradi."
            exit 0
          fi
          bash supabase/tests/live.sh --strict
