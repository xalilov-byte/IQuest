<!--
  IQUEST BRENDI — YAGONA MANBA (ARXITEKTURA.md §12)

  Bu sahifadan hamma narsa yasaladi: logo (SVG/PDF/PNG), ilova ikonkasi
  qatlamlari, bildirishnoma ikonkasi, splash, ijtimoiy tarmoq bannerlari,
  Play sarlavha rasmi, OG rasm va «Kun savoli» posti.

    node tools/mkbrand.mjs            → resources/brand/**  + MANIFEST.json
    node tools/mkbrand.mjs --serve    → shu sahifani brauzerda ko'rish
    node tools/mkicons.mjs            → android/app/src/main/res/** ikonkalari

  Sahifa HTTP orqali ochiladi (mkbrand o'zi kichik server ko'taradi):
  shriftlar node_modules/@fontsource dan, savol generatorlari src/iq dan,
  ilova ekran suratlari resources/brand/_shots dan o'qiladi. file:// da
  Chromium shriftlarni to'sadi.

  URL: brand.html?id=<aktiv>&lang=uz|ru|en  — faqat shu aktiv ko'rinadi.
       brand.html                         — hamma aktivlar ro'yxati (ko'rik).

  ── BELGI «Matritsa» (egasi tanlagan, 2026-09-26) ──────────────────────
  3×3 Raven matritsasi: kvadratlar diagonal bo'ylab doiraga aylanadi,
  oxirgi katak — marjon rangli doira (javob). 512 birlikli setka:
  katak 72, oraliq 28, boshlanishi 120; k=(qator+ustun)/4, burchak
  radiusi 4 + k·32, kattalashish k·3.5. Glif chegarasi 118.25…395.5.
  Plitka: to'q ko'k #10183A, kataklar oq, javob #FF5B3A (qorong'i fonda
  #FF6A4B, fon #0C1230). Miya, xoch, dafna, «rasmiy» muhr, raqam YO'Q.

  ── SO'Z BELGISI ───────────────────────────────────────────────────────
  «IQuest», Space Grotesk 700, tracking −0.01em, bir rangda: yorug' fonda
  #10183A, qorong'i fonda #FFFFFF. Harflar shriftdan KONTURGA
  aylantiriladi (pastdagi woff tahlilchisi) — SVG shriftsiz ham bir xil.
  Lokap: belgi balandligi = 1.55 × bosh harf, oraliq 0.62 × bosh harf,
  bo'sh joy har tomondan 0.9 × bosh harf.

  ── HALOLLIK (§12.4, CONTRACT §6) ──────────────────────────────────────
  Matnlar faqat T lug'atida. Liga, reyting, sertifikat, «rasmiy», Mensa,
  «IQ oshiradi», raqamli va'da, soxta foydalanuvchi soni — YO'Q.
  mkbrand har aktivning matnini halollik lintidan o'tkazadi.
-->

:root{
  --navy:#10183A; --night:#0C1230; --coral:#FF5B3A; --coral-d:#FF6A4B;
  --blue:#3D5EFF; --paper:#F5F3FF; --ink:#10183A;
  --snow:#FFFFFF; --muted:#A3ACD2; --surface:#18214A; --surface-2:#1E2858;
}
*{box-sizing:border-box;margin:0}
html,body{background:#0c0b12}
body{font-family:Manrope,system-ui,sans-serif;color:var(--snow);-webkit-font-smoothing:antialiased}
section{position:relative;overflow:hidden;display:none}
body.one section.on{display:block}
body.all section{display:block;margin:24px;outline:1px solid #333}
body.one{background:transparent}

/* ── Fon ──────────────────────────────────────────────────────────── */
.bg{position:absolute;inset:0;background:var(--night)}
.bg .g1,.bg .g2,.bg .g3{position:absolute;border-radius:50%}
.bg .g1{background:radial-gradient(circle,rgba(61,94,255,.30),rgba(61,94,255,0) 62%)}
.bg .g2{background:radial-gradient(circle,rgba(255,91,58,.13),rgba(255,91,58,0) 60%)}
.bg .g3{background:radial-gradient(circle,rgba(24,36,92,.95),rgba(24,36,92,0) 70%)}
/* 12 px nuqtali setka, oq 15% — ilovadagi matritsa tili. Chetga qarab so'nadi. */
.dots{position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.13) 1.3px,transparent 1.7px);
  background-size:12px 12px;background-position:6px 6px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 70% 45%,#000 20%,transparent 85%);}

/* ── Matn bloki ───────────────────────────────────────────────────── */
.txt{position:absolute;display:flex;flex-direction:column;align-items:flex-start;z-index:3}
.txt.center{align-items:center;text-align:center}
.lock{display:block}
.tag{font-weight:800;letter-spacing:-.035em;line-height:1.02;color:var(--snow);text-wrap:balance}
.sub{font-weight:600;color:var(--muted);letter-spacing:-.005em;line-height:1.3}
.chips{display:flex;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-weight:800;color:var(--snow);
  background:rgba(244,242,255,.08);border:1px solid rgba(244,242,255,.12);border-radius:999px}
.chip i{display:inline-block;border-radius:50%;background:var(--coral-d);flex:none}
.url{font-weight:700;color:var(--coral-d);letter-spacing:.01em}

/* ── Kartalar to'plami (1000×800 ichki koordinata) ──────────────────── */
.cluster{position:absolute;width:1000px;height:800px;transform-origin:0 0;z-index:2}
.card{position:absolute;border-radius:36px;box-shadow:0 40px 80px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.25)}
.card.matrix{background:#fff;padding:26px}
.card.matrix img{display:block;width:100%;height:auto}
.card.medal{background:linear-gradient(160deg,#1E2858,#141C44);border:1px solid rgba(255,255,255,.10)}
.phone{position:absolute;border-radius:54px;background:#0b0a10;padding:12px;
  box-shadow:0 50px 100px rgba(0,0,0,.55),0 0 0 2px rgba(244,242,255,.10) inset}
.phone .scr{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#18214A}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}

/* ── Kun savoli ───────────────────────────────────────────────────── */
.dq{position:absolute;inset:0;display:flex;flex-direction:column}
.dq>*{flex:none}
.dq .top{display:flex;align-items:center;justify-content:space-between}
.dq .kick{font-weight:800;color:var(--coral-d);letter-spacing:.02em;text-transform:uppercase}
.dq .q{font-weight:800;letter-spacing:-.02em;line-height:1.18;color:var(--snow)}
.dq .stim{background:#fff;border-radius:32px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:1 1 0;min-height:0}
.dq .stim img{display:block;height:100%;width:100%;object-fit:contain}
.dq .opts{display:grid;flex:none;justify-content:center}
.dq .opt{background:#fff;overflow:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);position:relative}
.dq .opt img{display:block;width:80%;height:80%;object-fit:contain}
.dq .opt b{font-family:Manrope;font-weight:800;letter-spacing:-.01em}
.dq .opt .l{position:absolute;left:14px;top:12px;font-weight:800;color:#6A6580;font-size:22px}
.dq .opt.ok{outline:6px solid #4CC38A;outline-offset:-6px}
.dq .opt.dim{opacity:.35}
.dq .exp{background:rgba(244,242,255,.07);border:1px solid rgba(244,242,255,.12);border-radius:24px;color:var(--snow);font-weight:600;line-height:1.4}
.dq .foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:700}

/* ═══════════════════════════ BELGI (§12.1) ════════════════════════════
   «Matritsa»: 3×3, kvadrat → doira diagonal bo'ylab, oxirgisi javob.
   512 setka (manba: tasdiqlangan concept-01.svg, proporsiyalar aynan). */
const MK = { s: 72, g: 28, o: 120, box: [118.25, 118.25, 395.5, 395.5] };
/* fg — kataklar, acc — javob katagi rangi (bir rangli variantda fg bilan bir xil). */
function cells(fg, acc) {
  let out = '';
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    const x = MK.o + j * (MK.s + MK.g), y = MK.o + i * (MK.s + MK.g);
    const k = (i + j) / 4, rr = 4 + k * (MK.s / 2 - 4), grow = k * 3.5;
    out += `<rect x="${r2(x - grow)}" y="${r2(y - grow)}" width="${r2(MK.s + 2 * grow)}" height="${r2(MK.s + 2 * grow)}" rx="${r2(rr + grow)}" fill="${i === 2 && j === 2 ? acc : fg}"/>`;
  }

}
/* Glifni markazi (cx, cy) ga, eni w ga joylash. */
function cellsAt(cx, cy, w, fg, acc) {
  const bw = MK.box[2] - MK.box[0], k = w / bw, gx = (MK.box[0] + MK.box[2]) / 2, gy = (MK.box[1] + MK.box[3]) / 2;
  return `<g transform="translate(${r2(cx - gx * k)} ${r2(cy - gy * k)}) scale(${r2(k * 1e5) / 1e5})">${cells(fg, acc)}</g>`;
}
/* Plitka: 512 setkadagi belgining o'zi (glif 54%). Burchak radiusi 22.5%.
   mode: dark | light — rangli; white | black — bir rangli, glif o'yilgan. */
const TILE_R = 0.225;
let uid = 0;
function tile(x, y, size, mode) {
  const k = size / 512, rx = r2(size * TILE_R), id = 't' + (++uid);
  const inner = fg => `<g transform="translate(${r2(x)} ${r2(y)}) scale(${r2(k * 1e5) / 1e5})">${fg}</g>`;
  if (mode === 'white' || mode === 'black') {
    const col = mode === 'white' ? C.white : C.black;
    return `<defs><mask id="${id}m" maskUnits="userSpaceOnUse" x="${r2(x)}" y="${r2(y)}" width="${r2(size)}" height="${r2(size)}">` +
      `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(size)}" height="${r2(size)}" fill="#fff"/>${inner(cells('#000', '#000'))}</mask></defs>` +
      `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(size)}" height="${r2(size)}" rx="${rx}" fill="${col}" mask="url(#${id}m)"/>`;
  }
  const edge = mode === 'dark'
    ? `<rect x="${r2(x + .004 * size)}" y="${r2(y + .004 * size)}" width="${r2(size * .992)}" height="${r2(size * .992)}" rx="${r2(rx - .004 * size)}" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="${r2(.008 * size)}"/>`
    : '';
  return `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(size)}" height="${r2(size)}" rx="${rx}" fill="${C.navy}"/>${edge}${inner(cells(C.white, C.coral))}`;
}
/* Rejimlar bo'yicha glif ranglari (lokaplar, plitkasiz). */
const MARK_COL = { dark: [C.white, C.coralDark], light: [C.navy, C.coral], white: [C.white, C.white], black: [C.black, C.black] };

/* ═══════════════ SO'Z BELGISI: woff → kontur (shriftsiz SVG) ═══════════
   WOFF 1.0 = sfnt jadvallari, har biri zlib bilan siqilgan. TrueType
   glyf konturlari (kvadratik Bezye) SVG yo'liga aylantiriladi. Harflar
   orasidagi masofa (kerning + tracking) brauzerning o'zidan o'lchanadi —
   ya'ni natija ekrandagi matn bilan aynan bir xil. Space Grotesk 700,
   tracking −0.01em, bitta rang (concept-01). */
const WM_TEXT = 'IQuest', WM_TRACK = -0.01;
let FONT = null, WM = null;
async function inflate(u8) {
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function loadFont(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  const dv = new DataView(buf);
  if (dv.getUint32(0) !== 0x774F4646) throw new Error('woff emas: ' + url);
  const tables = {};
  for (let i = 0, n = dv.getUint16(12); i < n; i++) {
    const o = 44 + i * 20;
    const tag = String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
    const off = dv.getUint32(o + 4), comp = dv.getUint32(o + 8), orig = dv.getUint32(o + 12);
    let u8 = new Uint8Array(buf, off, comp);
    if (comp < orig) u8 = await inflate(u8);
    tables[tag] = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  }
  const head = tables.head, os2 = tables['OS/2'];
  const f = { t: tables, upm: head.getUint16(18), locFmt: head.getInt16(50),
              cap: os2 && os2.getUint16(0) >= 2 ? os2.getInt16(88) : 700 };
  // cmap format 4 (Windows Unicode BMP)
  const cm = tables.cmap; let sub = null;
  for (let i = 0, n = cm.getUint16(2); i < n; i++) {
    const p = cm.getUint16(4 + i * 8), e = cm.getUint16(6 + i * 8), off = cm.getUint32(8 + i * 8);
    if (cm.getUint16(off) === 4 && ((p === 3 && e === 1) || p === 0)) { sub = off; break; }
  }
  f.gid = ch => {
    const c = ch.codePointAt(0), seg2 = cm.getUint16(sub + 6);
    const end = sub + 14, start = end + seg2 + 2, delta = start + seg2, ro = delta + seg2;
    for (let i = 0; i < seg2; i += 2) {
      if (cm.getUint16(end + i) < c) continue;
      if (cm.getUint16(start + i) > c) return 0;
      const r = cm.getUint16(ro + i), d = cm.getInt16(delta + i);
      if (!r) return (c + d) & 0xffff;
      const g = cm.getUint16(ro + i + r + 2 * (c - cm.getUint16(start + i)));
      return g ? (g + d) & 0xffff : 0;
    }
    return 0;
  };
  const loca = tables.loca;
  f.loc = g => f.locFmt ? [loca.getUint32(g * 4), loca.getUint32(g * 4 + 4)] : [loca.getUint16(g * 2) * 2, loca.getUint16(g * 2 + 2) * 2];
  return f;
}
/* Glif → konturlar [[{x,y,on}]] (kompozit glif ham) */
function glyphContours(f, g, m = [1, 0, 0, 1, 0, 0]) {
  const [a, b] = f.loc(g); if (a === b) return [];
  const gl = f.t.glyf; let p = a;
  const nc = gl.getInt16(p); p += 10;
  const tf = (x, y) => ({ x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] });
  if (nc >= 0) {
    const ends = []; for (let i = 0; i < nc; i++) { ends.push(gl.getUint16(p)); p += 2; }
    p += 2 + gl.getUint16(p);
    const n = nc ? ends[nc - 1] + 1 : 0, flags = [];
    while (flags.length < n) { const fl = gl.getUint8(p++); flags.push(fl); if (fl & 8) { let r = gl.getUint8(p++); while (r--) flags.push(fl); } }
    const xs = [], ys = []; let v = 0;
    for (const fl of flags) { if (fl & 2) { const d = gl.getUint8(p++); v += fl & 16 ? d : -d; } else if (!(fl & 16)) { v += gl.getInt16(p); p += 2; } xs.push(v); }
    v = 0;
    for (const fl of flags) { if (fl & 4) { const d = gl.getUint8(p++); v += fl & 32 ? d : -d; } else if (!(fl & 32)) { v += gl.getInt16(p); p += 2; } ys.push(v); }
    const out = []; let s = 0;
    for (const e of ends) { const c = []; for (let i = s; i <= e; i++) c.push(Object.assign(tf(xs[i], ys[i]), { on: !!(flags[i] & 1) })); out.push(c); s = e + 1; }
    return out;
  }
  let out = [], more = true;
  while (more) {
    const fl = gl.getUint16(p), cg = gl.getUint16(p + 2); p += 4;
    let dx, dy;
    if (fl & 1) { dx = gl.getInt16(p); dy = gl.getInt16(p + 2); p += 4; } else { dx = gl.getInt8(p); dy = gl.getInt8(p + 1); p += 2; }
    let sm = [1, 0, 0, 1];
    const f2 = o => gl.getInt16(o) / 16384;
    if (fl & 8) { const s = f2(p); sm = [s, 0, 0, s]; p += 2; }
    else if (fl & 0x40) { sm = [f2(p), 0, 0, f2(p + 2)]; p += 4; }
    else if (fl & 0x80) { sm = [f2(p), f2(p + 2), f2(p + 4), f2(p + 6)]; p += 8; }
    const cm2 = [m[0] * sm[0] + m[2] * sm[1], m[1] * sm[0] + m[3] * sm[1], m[0] * sm[2] + m[2] * sm[3], m[1] * sm[2] + m[3] * sm[3],
                 m[0] * dx + m[2] * dy + m[4], m[1] * dx + m[3] * dy + m[5]];
    out = out.concat(glyphContours(f, cg, cm2));
    more = !!(fl & 0x20);
  }
  return out;
}
const r2 = v => Math.round(v * 100) / 100;
function contourPath(c, X, Y) {
  // Kvadratik TrueType kontur: ketma-ket ikki off-nuqta orasida yashirin on-nuqta.
  const n = c.length; if (!n) return '';
  let st = c.findIndex(q => q.on), pts;
  if (st < 0) { const a = c[0], b = c[1]; pts = [{ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, on: true }, ...c.slice(1), c[0]]; st = 0; }
  else pts = c.slice(st).concat(c.slice(0, st));
  let d = `M${r2(X(pts[0].x))} ${r2(Y(pts[0].y))}`;
  for (let i = 1; i <= pts.length; i++) {
    const q = pts[i % pts.length], prev = pts[i - 1];
    if (q.on) { if (prev.on) d += `L${r2(X(q.x))} ${r2(Y(q.y))}`; }
    else {
      const nx = pts[(i + 1) % pts.length];
      const e = nx.on ? nx : { x: (q.x + nx.x) / 2, y: (q.y + nx.y) / 2 };
      d += `Q${r2(X(q.x))} ${r2(Y(q.y))} ${r2(X(e.x))} ${r2(Y(e.y))}`;
      if (nx.on) i++;

  }
  return d + 'Z';
}
/* Harf o'rinlari brauzerdan: shrift o'lchami = unitsPerEm px, ya'ni 1 px = 1 birlik. */
async function buildWordmark() {
  FONT = await loadFont('../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff');
  await document.fonts.load(`700 ${FONT.upm}px "Space Grotesk"`, WM_TEXT);
  const sp = document.createElement('span');
  sp.style.cssText = `position:absolute;left:0;top:0;white-space:pre;font:700 ${FONT.upm}px "Space Grotesk";letter-spacing:${WM_TRACK}em;font-kerning:normal`;
  sp.textContent = WM_TEXT; document.body.appendChild(sp);
  const base = sp.getBoundingClientRect().left, xs = [];
  for (let i = 0; i < WM_TEXT.length; i++) {
    const r = document.createRange(); r.setStart(sp.firstChild, i); r.setEnd(sp.firstChild, i + 1);
    xs.push(r.getBoundingClientRect().left - base);
  }
  sp.remove();
  const glyphs = [...WM_TEXT].map((ch, i) => {
    const g = FONT.gid(ch), cs = glyphContours(FONT, g).map(c => c.map(q => ({ x: q.x + xs[i], y: q.y, on: q.on })));
    return { ch, cs };
  });
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const gl of glyphs) for (const c of gl.cs) for (const q of c) { x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
  WM = { glyphs, x0, x1, y0, y1, cap: FONT.cap, upm: FONT.upm };
}
/* So'z belgisi: chap-ink x, tayanch chiziq y, bosh harf balandligi capH */
function wordmark(x, baseline, capH, colIQ, colRest) {
  const s = capH / WM.cap, X = v => x + (v - WM.x0) * s, Y = v => baseline - v * s;
  const d = (from, to) => WM.glyphs.slice(from, to).map(g => g.cs.map(c => contourPath(c, X, Y)).join('')).join('');
  return { svg: `<path fill="${colIQ}" d="${d(0, 2)}"/><path fill="${colRest}" d="${d(2)}"/>`,
           w: (WM.x1 - WM.x0) * s, top: baseline - WM.y1 * s, bottom: baseline - WM.y0 * s };
}
const WM_COL = { dark: [C.white, C.white], light: [C.navy, C.navy], white: [C.white, C.white], black: [C.black, C.black] };

/* ═══════════════ LOKAPLAR (§12.1) ══════════════════════════════════════
   Concept-01 qoidasi: belgi balandligi = 1.55 × bosh harf (C), oraliq
   0.62 C, bo'sh joy har tomondan 0.9 C (SVG fayllarda shu zaxira bor).
   Belgi o'lchami: plitka uchun 100 birlik, glif uchun 100 birlik eni. */
const CAP = 40;
function logo(kind, mode, tight) {
  let body, W, H;
  const pad = tight ? 0 : 0.9 * CAP;   // tight — bannerlar ichida (bo'sh joyni maket beradi)
  if (kind === 'mark') {                 // plitka
    const t = 100, pad2 = 0.12 * t;
    W = H = t + 2 * pad2; body = tile(pad2, pad2, t, mode === 'dark' ? 'light' : mode);  // chegara chizig'i faqat watermark'da
  } else if (kind === 'glyph') {        // plitkasiz glif; bo'sh joy = 1 katak oralig'i
    const w = 100, cp = w * 72 / 277.25;   // bo'sh joy = bitta katak
    W = H = w + 2 * cp; body = cellsAt(W / 2, H / 2, w, ...MARK_COL[mode]);
  } else if (kind === 'horizontal') {
    const mh = 1.55 * CAP, gap = 0.62 * CAP, mid = pad + Math.max(mh, CAP) / 2;
    const wm = wordmark(pad + mh + gap, mid + CAP / 2, CAP, ...WM_COL[mode]);
    W = pad + mh + gap + wm.w + pad; H = Math.max(mh, CAP) + 2 * pad;
    body = cellsAt(pad + mh / 2, mid, mh, ...MARK_COL[mode]) + wm.svg;
  } else {                               // stacked
    const mh = 2.2 * CAP, gap = 0.7 * CAP, wm0 = wordmark(0, 0, CAP, '#000', '#000');
    W = Math.max(mh, wm0.w) + 2 * pad;
    const base = pad + mh + gap + CAP;
    const wm = wordmark((W - wm0.w) / 2, base, CAP, ...WM_COL[mode]);
    H = Math.ceil(wm.bottom) + pad;
    body = cellsAt(W / 2, pad + mh / 2, mh, ...MARK_COL[mode]) + wm.svg;
  }
  W = r2(W); H = r2(H);
  return { w: W, h: H, svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W * 4}" height="${H * 4}">${body}</svg>` };
}
window.brandLogo = (kind, mode) => logo(kind, mode);

}
function shotURL(lang, theme) { return `../resources/brand/_shots/question-${theme}-${lang}.png`; }
/* Kartalar to'plami 1000×800 ichki koordinatada, kerakli qutiga sig'diriladi. */
function cluster(box, lang, opt = {}) {
  const it = heroMatrix();
  const theme = opt.theme || 'dark';
  const sc = Math.min(box.w / 1000, box.h / 800);
  const x = box.x + (box.w - 1000 * sc) * (opt.ax ?? 0.5), y = box.y + (box.h - 800 * sc) * (opt.ay ?? 0.5);
  return `<div class="cluster" style="left:${x}px;top:${y}px;transform:scale(${sc})">
    <div class="card medal" style="left:120px;top:70px;width:300px;height:236px;transform:rotate(-5deg);display:grid;place-items:center">${medalSVG(250)}</div>
    <div class="phone" data-shot style="left:585px;top:60px;width:380px;height:657px;transform:rotate(4deg)"><div class="scr"><img src="${shotURL(lang, theme)}" alt=""></div></div>
    <div class="card matrix" style="left:250px;top:300px;width:420px;transform:rotate(-7deg)"><img src="${IQ.svgSrc(it.stimulus.svg)}" alt=""></div>
  </div>`;
}

/* ═════════════════════════ QOLIPLAR (TPL) ═════════════════════════════ */
function bgHTML(w, h, glow = [0.72, 0.4]) {
  const m = Math.max(w, h);
  return `<div class="bg">
    <div class="g3" style="width:${m * 1.4}px;height:${m * 1.4}px;left:${w * glow[0] - m * .7}px;top:${h * glow[1] - m * .7}px"></div>
    <div class="g1" style="width:${m * .95}px;height:${m * .95}px;left:${-m * .3}px;top:${-m * .38}px"></div>
    <div class="g2" style="width:${m * .8}px;height:${m * .8}px;left:${w - m * .45}px;top:${h - m * .42}px"></div>
  </div><div class="dots"></div>`;
}
function lockupImg(height, mode = 'dark', kind = 'horizontal') {
  const L = logo(kind, mode, true);
  const k = height / L.h;
  return `<div class="lock" style="width:${r2(L.w * k)}px;height:${height}px">${L.svg.replace(/width="[^"]+" height="[^"]+"/, `width="${r2(L.w * k)}" height="${height}"`)}</div>`;
}
function textBlock(lang, s, o = {}) {
  // s — asosiy o'lcham (tagline px). Hamma o'lchamlar undan.
  const t = T[lang];
  const chips = o.chips === false ? '' : `<div class="chips" style="gap:${s * .16}px;margin-top:${s * .6}px;flex-wrap:nowrap">${t.chips.map(c =>
      `<span class="chip" style="font-size:${s * .25}px;padding:${s * .14}px ${s * .24}px;gap:${s * .12}px;white-space:nowrap"><i style="width:${s * .1}px;height:${s * .1}px"></i>${c}</span>`).join('')}</div>`;
  const url = SITE.url ? `<div class="url" style="font-size:${s * .3}px;margin-top:${s * .5}px">${SITE.url}</div>` : '';
  return `<div class="lock-wrap">${lockupImg(o.lock || s * .9)}</div>
    <div class="tag" style="font-size:${s}px;margin-top:${s * (o.gap || .55)}px;max-width:${o.maxw || 99999}px">${t.tag}</div>
    ${o.sub === false ? '' : `<div class="sub" style="font-size:${s * .38}px;margin-top:${s * .3}px">${t.sub}</div>`}
    ${chips}${url}`;
}
const SITE = { url: '' };

const TPL = {
  logo(sec) {
    const [kind, mode] = sec.dataset.v.split(':');
    const L = logo(kind, mode);
    const scale = kind === 'mark' || kind === 'glyph' ? 1024 / Math.max(L.w, L.h) : 1600 / L.w;
    const W = Math.round(L.w * scale), H = Math.round(L.h * scale);
    sec.dataset.w = W; sec.dataset.h = H; sec.dataset.fmt = 'png-alpha';
    sec.innerHTML = L.svg.replace(/width="[^"]+" height="[^"]+"/, `width="${W}" height="${H}" style="display:block"`);
  },
  /* Play 512 va eski ikonka manbasi: to'liq kvadrat (Play burchakni o'zi yumaloqlaydi). */
  'icon-only'(sec, w) {
    sec.innerHTML = `<svg viewBox="0 0 512 512" width="${w}" height="${w}" style="display:block"><rect width="512" height="512" fill="${C.navy}"/>${cells(C.white, C.coral)}</svg>`;
  },
  'icon-legacy'(sec, w) {  // API 24–25: yumaloq kvadrat, chetda 4% zaxira
    sec.innerHTML = `<svg viewBox="0 0 100 100" width="${w}" height="${w}" style="display:block">${tile(4, 4, 92, 'light')}</svg>`;
  },
  'icon-round'(sec, w) {
    sec.innerHTML = `<svg viewBox="0 0 100 100" width="${w}" height="${w}" style="display:block"><circle cx="50" cy="50" r="46" fill="${C.navy}"/>${cellsAt(50, 50, 46, C.white, C.coral)}</svg>`;
  },
  /* Adaptiv ikonka: 108 birlikli qatlam, ko'rinadigan qism markazdagi 72,
     xavfsiz zona 66 diametrli doira. Orqa qatlam — tekis #10183A; old —
     glif, plitkadagi proporsiyada (512 → 72): eni 39, eng uzoq burchak
     markazdan 27.6 (< 33) — doira, squircle, tomchi niqoblarida kesilmaydi.
     Monoxrom — shu glif bir rangda (javob katagi ham to'la doira). */
  adaptive(sec, w) {
    const layer = sec.dataset.layer, gw = 277.25 * 72 / 512;
    const body = layer === 'bg' ? `<rect width="108" height="108" fill="${C.navy}"/>`
      : layer === 'mono' ? cellsAt(54, 54, gw, '#fff', '#fff') : cellsAt(54, 54, gw, C.white, C.coral);
    sec.innerHTML = `<svg viewBox="0 0 108 108" width="${w}" height="${w}" style="display:block">${body}</svg>`;
  },
  /* Bildirishnoma ikonkasi: 24dp, jonli maydon 20×20, oq siluet. Kichik
     o'lchamda o'qilishi uchun soddalashtirilgan: 8 ta kvadrat (bir xil
     yumshoq burchak) + to'la doira — javob. Oraliq nisbatan kengroq. */
  stat(sec, w) {
    let d = '';
    // Butun dp setkasi: katak 5, oraliq 2, chekka 2 → mdpi/xhdpi/xxxhdpi da piksel-aniq.
    const c = 5, g = 2, o = 2;  // 0.5dp chapga — xxhdpi (3×) da ham butun piksel
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const x = o + j * (c + g), y = o + i * (c + g), last = i === 2 && j === 2;
      d += `<rect x="${r2(x)}" y="${r2(y)}" width="${c}" height="${c}" rx="${last ? c / 2 : 1.1}" fill="#fff"/>`;
    }
    sec.innerHTML = `<svg viewBox="0 0 24 24" width="${w}" height="${w}" style="display:block">${d}</svg>`;
  },
  /* Splash: yorug' (oq fon, to'q ko'k glif) va qorong'i (#0C1230, oq glif). */
  splash(sec, w) {
    const dark = sec.dataset.mode === 'dark';
    sec.innerHTML = `<svg viewBox="0 0 100 100" width="${w}" height="${w}" style="display:block"><rect width="100" height="100" fill="${dark ? C.night : C.white}"/>${cellsAt(50, 50, 15, ...(dark ? [C.white, C.coralDark] : [C.navy, C.coral]))}</svg>`;
  },
  avatar(sec, w) {  // doira ichida xavfsiz: glif eni 52%
    sec.innerHTML = `<svg viewBox="0 0 100 100" width="${w}" height="${w}" style="display:block"><defs><radialGradient id="vr" cx=".3" cy=".22" r=".8"><stop offset="0" stop-color="#1C2A66"/><stop offset="1" stop-color="${C.navy}"/></radialGradient></defs>
      <rect width="100" height="100" fill="url(#vr)"/>${cellsAt(50, 50, 52, C.white, C.coral)}</svg>`;
  },
  watermark(sec, w) {
    sec.innerHTML = `<svg viewBox="0 0 100 100" width="${w}" height="${w}" style="display:block">${tile(4, 4, 92, 'dark')}</svg>`;
  },
  highlight(sec, w, h) {  // glif markazdagi 420 px doira ichida
    const g = sec.dataset.glyph;
    sec.innerHTML = bgHTML(w, h, [.5, .5]) + `<div style="position:absolute;left:${w / 2 - 210}px;top:${h / 2 - 210}px;width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#22307A,#141D4A 70%);box-shadow:0 0 0 3px rgba(255,106,75,.55) inset;display:grid;place-items:center">${g === 'brand' ? `<svg viewBox="0 0 100 100" width="210" height="210">${cellsAt(50, 50, 84, C.white, C.coralDark)}</svg>` : glyph(g, 210, '#FFFFFF', 1.9)}</div>`;
  },
  wide(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    const s = Math.round(sh * .135);
    const tw = sw * .52;
    sec.innerHTML = bgHTML(w, h) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;height:${sh}px;width:${tw}px;justify-content:center">${textBlock(lang, s, { maxw: tw })}</div>` +
      cluster({ x: sx + sw * .5, y: sy - sh * .04, w: sw * .5, h: sh * 1.08 }, lang, { ax: .9 });
  },
  xheader(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    const s = 58;
    sec.innerHTML = bgHTML(w, h, [.6, .3]) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;height:${sh}px;width:${sw * .55}px;justify-content:center">${textBlock(lang, s, { chips: false })}</div>` +
      cluster({ x: sx + sw * .54, y: 0, w: sw * .46, h: h }, lang, { ax: .5 });
  },
  mini(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    sec.innerHTML = bgHTML(w, h) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;height:${sh}px;width:${sw * .56}px;justify-content:center">${textBlock(lang, 34, { chips: false, sub: false, lock: 30 })}</div>` +
      cluster({ x: sx + sw * .5, y: sy - 20, w: sw * .56, h: sh + 40 }, lang, { ax: 1 });
  },
  square(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    sec.innerHTML = bgHTML(w, h, [.5, .75]) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;width:${sw}px">${textBlock(lang, 92, { chips: false, maxw: sw })}</div>` +
      cluster({ x: sx - 40, y: sy + sh * .43, w: sw + 80, h: sh * .6 }, lang, { ay: 1 });
  },
  portrait(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    sec.innerHTML = bgHTML(w, h, [.5, .75]) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;width:${sw}px">${textBlock(lang, 96, { maxw: sw })}</div>` +
      cluster({ x: sx - 40, y: sy + sh * .44, w: sw + 80, h: sh * .58 }, lang, { ay: 1 });
  },
  story(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    sec.innerHTML = bgHTML(w, h, [.5, .6]) +
      `<div class="txt center" style="left:${sx}px;top:${sy + 40}px;width:${sw}px">${textBlock(lang, 104, { chips: false, maxw: sw })}</div>` +
      cluster({ x: sx - 60, y: sy + 560, w: sw + 120, h: 700 }, lang) +
      `<div class="txt center" style="left:${sx - 40}px;top:${sy + sh - 110}px;width:${sw + 80}px"><div class="chips" style="gap:14px;justify-content:center;flex-wrap:nowrap">${T[lang].chips.map(c =>
        `<span class="chip" style="font-size:29px;padding:15px 24px;gap:12px;white-space:nowrap"><i style="width:11px;height:11px"></i>${c}</span>`).join('')}</div></div>`;
  },
  ytbanner(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    sec.innerHTML = bgHTML(w, h, [.62, .5]) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;height:${sh}px;width:${sw * .56}px;justify-content:center">${textBlock(lang, 108, { maxw: sw * .56 })}</div>` +
      cluster({ x: sx + sw * .54, y: sy - 230, w: sw * .5, h: sh + 460 }, lang, { ax: .6 });
  },
  thumb(sec, w, h, lang) {
    const [sx, sy, sw, sh] = sec.dataset.safe.split(',').map(Number);
    const it = heroMatrix();
    sec.innerHTML = bgHTML(w, h, [.7, .5]) +
      `<div class="txt" style="left:${sx}px;top:${sy}px;height:${sh}px;width:${sw * .5}px;justify-content:space-between">
         ${lockupImg(46)}<div class="tag" style="font-size:78px;line-height:1.05">${T[lang].thumb}</div><div></div></div>
       <div class="card matrix" style="position:absolute;left:${sx + sw - sh + 50}px;top:${sy + 30}px;width:${sh - 60}px;transform:rotate(-3deg)"><img src="${IQ.svgSrc(it.stimulus.svg)}" alt=""></div>`;
  },
  daily(sec, w, h, lang) { DAILY.render(sec, w, h, lang); },
};

/* ═══════════════ «KUN SAVOLI» (§12.4): haqiqiy savol, sana urug'i ═════ */
const DAILY = {
  // sana → urug' (FNV-1a), tur va daraja — hammasi sanadan, Date.now yo'q
  pick(date) {
    let hsh = 2166136261;
    for (const ch of 'iquest-daily-' + date) { hsh ^= ch.charCodeAt(0); hsh = Math.imul(hsh, 16777619) >>> 0; }
    const day = Math.floor(Date.parse(date + 'T00:00:00Z') / 864e5);
    const types = ['matrix', 'series', 'spatial'].filter(t => IQ.generator && IQ.generator(t));
    const type = types[day % types.length], level = 3 + (day % 4);
    for (let k = 0; k < 20; k++) {
      try { return { type, level, seed: (hsh + k) >>> 0, item: IQ.makeItem(type, (hsh + k) >>> 0, level) }; } catch (e) {}
    }
    throw new Error('kun savoli yasalmadi');
  },
  render(sec, w, h, lang) {
    const date = Q.get('date');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) throw new Error('--date=YYYY-MM-DD kerak');
    const { item } = DAILY.pick(date), t = T[lang], ans = sec.dataset.daily === 'a';
    const tx = v => (v && (v[lang] || v.uz)) || '';
    const tall = h > w, pad = 72, L = 'ABCDEF';
    const n = item.options.length;
    // Kvadrat postda variantlar bitta qatorda, storyda 3 ustun (katak o'lchami qat'iy).
    const cols = tall ? (n <= 4 ? n : 3) : n, gap = tall ? 20 : 16;
    const cell = Math.min(tall ? (ans ? 190 : 250) : 190, Math.floor((w - 2 * pad - (cols - 1) * gap) / cols));
    const opt = (o, i) => {
      const cls = ans ? (i === item.correct ? ' ok' : ' dim') : '';
      const inner = o.kind === 'svg' ? `<img src="${IQ.svgSrc(o.svg)}" alt="">` : `<b style="font-size:${tall ? 52 : 44}px">${tx(o)}</b>`;
      return `<div class="opt${cls}" style="width:${cell}px;height:${cell}px">${inner}<span class="l">${L[i]}</span></div>`;
    };
    const stim = item.stimulus.kind === 'svg'
      ? `<img src="${IQ.svgSrc(item.stimulus.svg)}" alt="">`
      : `<div style="font:800 ${tall ? 64 : 56}px 'Space Grotesk',Manrope;letter-spacing:-.01em;padding:0 32px;text-align:center">${tx(item.stimulus)}</div>`;
    sec.innerHTML = bgHTML(w, h, [.5, .5]) + `<div class="dq" style="height:${h}px;padding:${tall ? '250px' : pad + 'px'} ${pad}px ${tall ? '340px' : pad + 'px'};gap:${tall ? 36 : 26}px">
      <div class="top">${lockupImg(tall ? 44 : 38)}<span class="kick" style="font-size:${tall ? 32 : 28}px">${ans ? t.answer : t.daily} · ${date}</span></div>
      <div class="q" style="font-size:${tall ? 50 : 42}px">${tx(item.prompt)}</div>
      <div class="stim" style="padding:24px">${stim}</div>
      <div class="opts" style="grid-template-columns:repeat(${cols},${cell}px);gap:${gap}px">${item.options.map(opt).join('')}</div>
      ${ans ? `<div class="exp" style="font-size:${tall ? 28 : 26}px;padding:${tall ? 24 : 20}px ${tall ? 28 : 26}px"><b style="color:var(--coral-d)">${t.why}: </b>${tx(item.explain)}</div>`
            : `<div class="foot" style="font-size:${tall ? 30 : 24}px"><span>${t.next} →</span></div>`}
    </div>`;
  },
};

/* ═════════════════════════════ ISHGA TUSHIRISH ═════════════════════════ */
const Q = new URLSearchParams(location.search);
window.brandInfo = () => [...document.querySelectorAll('section')].map(s => ({
  id: s.dataset.id, group: s.dataset.group, w: +s.dataset.w || 0, h: +s.dataset.h || 0,
  fmt: s.dataset.fmt || 'png', tpl: s.dataset.tpl, langs: (s.dataset.langs || '').split(',').filter(Boolean),
  daily: !!s.dataset.daily, logo: s.dataset.tpl === 'logo', v: s.dataset.v || '' }));

async function render(sec, lang) {
  const w = +sec.dataset.w, h = +sec.dataset.h;
  if (w && h) { sec.style.width = w + 'px'; sec.style.height = h + 'px'; }
  TPL[sec.dataset.tpl](sec, w, h, lang);
  if (!w || !h) { sec.style.width = sec.dataset.w + 'px'; sec.style.height = sec.dataset.h + 'px'; }
  sec.lang = lang;
  // Rasm yuklanishini kutish; ilova surati yo'q bo'lsa telefon kartasi olib tashlanadi
  // (soxta ekran chizilmaydi) va mkbrand ogohlantiradi.
  const imgs = [...sec.querySelectorAll('img')];
  await Promise.all(imgs.map(im => im.complete && im.naturalWidth ? 0 : new Promise(r => { im.onload = r; im.onerror = r; })));
  for (const im of imgs) if (!im.naturalWidth) {
    const ph = im.closest('[data-shot]');
    if (ph) { ph.remove(); (window.__warn = window.__warn || []).push('ilova surati yoʻq: ' + im.getAttribute('src')); }
    else throw new Error('rasm yuklanmadi: ' + im.src.slice(0, 80));
  }
}

(async () => {
  try {
    SITE.url = Q.get('url') || '';
    await buildWordmark();
    await document.fonts.ready;
    const id = Q.get('id'), group = Q.get('group'), lang = Q.get('lang') || 'uz';
    document.documentElement.lang = lang;
    if (id) {
      const sec = [...document.querySelectorAll('section')].find(s => s.dataset.id === id && (!group || s.dataset.group === group));
      if (!sec) throw new Error('aktiv topilmadi: ' + group + '/' + id);
      document.body.className = 'one'; sec.classList.add('on');
      await render(sec, lang);
    } else {
      document.body.className = 'all';
      for (const sec of document.querySelectorAll('section')) {
        if (sec.dataset.daily && !Q.get('date')) continue;
        try { await render(sec, lang); } catch (e) { sec.textContent = e.message; }
        sec.style.zoom = Math.min(1, 520 / (+sec.dataset.w || 520));
      }
    }
    await document.fonts.ready;
    window.__ready = true;
  } catch (e) {
    window.__error = String(e && e.stack || e);
    window.__ready = true;
  }
})();
</script>
