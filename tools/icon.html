<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Manrope';font-weight:800;src:url(../www/fonts/manrope-latin-800-normal.woff2) format('woff2')}
  html,body{margin:0;padding:0}
  .canvas{width:1024px;height:1024px;display:grid;place-items:center;position:relative}
  .bg-dark{background:#14121F}
  .bg-none{background:transparent}
  /* Brend belgisi: oltin romb + qorong'i "N" — ilova sarlavhasidagi bilan bir xil */
  .romb{
    width:var(--s);height:var(--s);background:#FFA726;
    border-radius:calc(var(--s) * .25);
    transform:rotate(45deg);
    display:grid;place-items:center;
  }
  .romb span{
    transform:rotate(-45deg);
    font-family:'Manrope',sans-serif;font-weight:800;
    font-size:calc(var(--s) * .54);color:#1C1B29;line-height:1;
    margin-top:calc(var(--s) * -.02);
  }
  /* splash uchun kichikroq belgi */
  .splash{width:2732px;height:2732px;display:grid;place-items:center}
</style></head>
<body>
<div id="icon" class="canvas bg-dark"><div class="romb" style="--s:520px"><span>N</span></div></div>
<div id="fg" class="canvas bg-none"><div class="romb" style="--s:460px"><span>N</span></div></div>
<div id="bg" class="canvas bg-dark"></div>
<div id="splash" class="splash bg-dark"><div class="romb" style="--s:520px"><span>N</span></div></div>
</body></html>
